name: OBlender Android Build (skeleton)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-build.yml'
      - 'OBlender/**'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout APP (self)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout lib-android_arm64
        uses: actions/checkout@v4
        with:
          repository: dshawshank/lib-android_arm64
          ref: main
          fetch-depth: 1
          path: lib-android_arm64

      - name: Checkout Utilities-android_arm64
        uses: actions/checkout@v4
        with:
          repository: dshawshank/Utilities-android_arm64
          ref: main
          fetch-depth: 1
          path: Utilities-android_arm64

      - name: Checkout Blender-android_arm64 (shallow)
        uses: actions/checkout@v4
        with:
          repository: dshawshank/Blender-android_arm64
          ref: blender-v3.6-release
          fetch-depth: 1
          path: Blender-android_arm64

      - name: Setup JDK 11 (Gradle 6.5 + AGP 4.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK / NDK / CMake
        run: |
          set -x
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          ls $ANDROID_HOME/ndk/ || true
          $ANDROID_HOME/cmake/3.10.2.4988404/bin/cmake --version || true

      - name: Patch hardcoded Windows paths D:/FreeProjects
        run: |
          set -x
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "=== files with D:/ before ==="
          grep -rl "D:/FreeProjects" OBlender/ || echo "none in OBlender/"
          # Replace D:/FreeProjects/Blender/Blender -> $GITHUB_WORKSPACE
          # This makes:
          #   Blender-android_arm64 -> $GITHUB_WORKSPACE/Blender-android_arm64
          #   lib-android_arm64     -> $GITHUB_WORKSPACE/lib-android_arm64
          #   Utilities .cxx output -> $GITHUB_WORKSPACE/build-intermediates (will be generated)
          grep -rl "D:/FreeProjects/Blender/Blender" OBlender/ | xargs sed -i "s|D:/FreeProjects/Blender/Blender|$GITHUB_WORKSPACE|g" || true
          echo "=== after patch ==="
          grep -rn "FreeProjects\|D:/" OBlender/app/src/main/cpp/CMakeLists.txt || echo "clean, no D:/ left in app CMakeLists"
          grep -rn "blenderLibDir" OBlender/app/src/main/cpp/CMakeLists.txt | head -n 20
          ls -d $GITHUB_WORKSPACE/Blender-android_arm64 $GITHUB_WORKSPACE/lib-android_arm64 $GITHUB_WORKSPACE/Utilities-android_arm64 || true

      - name: Show project layout
        run: |
          ls -R OBlender | head -n 100
          cat OBlender/settings.gradle
          cat OBlender/gradle/wrapper/gradle-wrapper.properties
          java -version
          echo "ndk=$ANDROID_NDK_HOME"

      - name: Build APK (assembleDebug)
        working-directory: OBlender
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -n 200
        continue-on-error: true

      - name: Collect outputs
        if: always()
        run: |
          find . -name "*.apk" -o -name "*.aab" | head -n 20 || true
          find OBlender -maxdepth 4 -name "build" -type d || true
          du -sh OBlender/app/build 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oblender-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
