name: OBlender Android Full Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-build.yml'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext libpng-dev libjpeg-dev > /dev/null
          df -h

      - name: Checkout APP (self)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout lib-android_arm64
        uses: actions/checkout@v4
        with:
          repository: dshawshank/lib-android_arm64
          ref: main
          fetch-depth: 1
          path: lib-android_arm64

      - name: Checkout Utilities-android_arm64
        uses: actions/checkout@v4
        with:
          repository: dshawshank/Utilities-android_arm64
          ref: main
          fetch-depth: 1
          path: Utilities-android_arm64

      - name: Checkout Blender-android_arm64 (shallow)
        uses: actions/checkout@v4
        with:
          repository: dshawshank/Blender-android_arm64
          ref: blender-v3.6-release
          fetch-depth: 1
          path: Blender-android_arm64

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK / NDK / CMake
        run: |
          set -x
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Gradle 6.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.5-bin.zip -O /tmp/gradle-6.5.zip
          sudo unzip -q /tmp/gradle-6.5.zip -d /opt/
          echo "/opt/gradle-6.5/bin" >> $GITHUB_PATH

      - name: Patch ALL Windows paths (v4 universal)
        run: |
          set -x
          echo "WS=$GITHUB_WORKSPACE"
          echo "=== D:/ count before ==="
          grep -rl "D:/FreeProjects/Blender/Blender" $GITHUB_WORKSPACE --include="*.cmake" --include="CMakeLists.txt" --include="*.gradle" 2>/dev/null | head -n 30 || true
          grep -rl "D:/FreeProjects/Blender/Blender" $GITHUB_WORKSPACE --include="*.cmake" --include="CMakeLists.txt" --include="*.gradle" 2>/dev/null | xargs sed -i "s|D:/FreeProjects/Blender/Blender|$GITHUB_WORKSPACE|g" || true
          echo "=== after ==="
          grep -rn "FreeProjects\|D:/FreeProjects" $GITHUB_WORKSPACE --include="*.cmake" --include="CMakeLists.txt" --include="*.gradle" 2>/dev/null | head -n 10 || echo "clean"
          # cpython double-include fix: error wants .../cpython/include/include/Python.h
          # real file is .../cpython/include/Include/Python.h
          ls $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/ | head -n 20
          ls $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/Include/Python.h && echo "capital Include exists"
          if [ ! -f "$GITHUB_WORKSPACE/lib-android_arm64/cpython/include/include/Python.h" ]; then
            mkdir -p $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/include
            # symlink all headers from Include (capital I) to include (lowercase)
            cp -r $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/Include/* $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/include/ 2>/dev/null || true
            ls $GITHUB_WORKSPACE/lib-android_arm64/cpython/include/include/Python.h && echo "python.h fixed"
          fi

      - name: Fix prebuilt generated headers (v5 libpng etc)
        run: |
          set -x
          # libpng: pnglibconf.h is generated, repo only has .prebuilt
          PNGDIR=$GITHUB_WORKSPACE/lib-android_arm64/Png/include/libpng-1.6.40
          ls $PNGDIR/scripts/ | head -n 20
          if [ ! -f "$PNGDIR/pnglibconf.h" ] && [ -f "$PNGDIR/scripts/pnglibconf.h.prebuilt" ]; then
            cp $PNGDIR/scripts/pnglibconf.h.prebuilt $PNGDIR/pnglibconf.h
            echo "pnglibconf.h fixed"
          fi
          ls $PNGDIR/pnglibconf.h
          # generic: list other missing generated headers early (do not fail)
          grep -rn "pnglibconf.h" $GITHUB_WORKSPACE/lib-android_arm64 --include="*.h" | head -n 5 || true

      - name: Host-build makesdna v4 (gen includes first)
        run: |
          set -x
          cd $GITHUB_WORKSPACE/Blender-android_arm64
          mkdir -p /tmp/host_dna/out /tmp/host_dna/inc
          # Generate dna_includes_all.h + dna_includes_as_strings.h from SRC_DNA_INC
          python3 - <<'PYEOF'
          import re, os
          ws = os.environ['GITHUB_WORKSPACE']
          cmake_path = os.path.join(ws, 'Blender-android_arm64/source/blender/CMakeLists.txt')
          txt = open(cmake_path).read()
          m = re.search(r'set\(SRC_DNA_INC(.*?)\)', txt, re.S)
          assert m, "SRC_DNA_INC not found"
          body = m.group(1)
          headers = re.findall(r'\$\{CMAKE_CURRENT_SOURCE_DIR\}/(makesdna/[^\s\)]+)', body)
          print(f"found {len(headers)} DNA headers")
          inc_text = "/* Do not edit manually, changes will be overwritten. */\n"
          list_text = "/* Do not edit manually, changes will be overwritten. */\n"
          import os as _os
          for h in headers:
            full = _os.path.join(ws, 'Blender-android_arm64/source/blender', h)
            inc_text += f'#include "{full}"\n'
            list_text += f'\t"{_os.path.basename(h)}",\n'
          open('/tmp/host_dna/inc/dna_includes_all.h','w').write(inc_text)
          open('/tmp/host_dna/inc/dna_includes_as_strings.h','w').write(list_text)
          print("wrote includes")
          PYEOF
          ls -lh /tmp/host_dna/inc/
          gcc -o /tmp/host_dna/makesdna \
            source/blender/makesdna/intern/makesdna.c \
            source/blender/makesdna/intern/dna_utils.c \
            source/blender/blenlib/intern/BLI_assert.c \
            source/blender/blenlib/intern/BLI_ghash.c \
            source/blender/blenlib/intern/BLI_ghash_utils.c \
            source/blender/blenlib/intern/BLI_memarena.c \
            source/blender/blenlib/intern/BLI_mempool.c \
            source/blender/blenlib/intern/hash_mm2a.c \
            intern/guardedalloc/intern/leak_detector.cc \
            intern/guardedalloc/intern/mallocn.c \
            intern/guardedalloc/intern/mallocn_guarded_impl.c \
            intern/guardedalloc/intern/mallocn_lockfree_impl.c \
            intern/guardedalloc/intern/memory_usage.cc \
            -DWITH_DNA_GHASH \
            -I/tmp/host_dna/inc \
            -Isource/blender/makesdna \
            -Isource/blender/blenlib \
            -Iintern/guardedalloc \
            -Iintern/atomic \
            -lstdc++ -lm -lpthread
          ls -lh /tmp/host_dna/makesdna
          /tmp/host_dna/makesdna /tmp/host_dna/out/dna.c /tmp/host_dna/out/dna_type_offsets.h /tmp/host_dna/out/dna_verify.c source/blender/makesdna/
          ls -lh /tmp/host_dna/out/
          head -n 3 /tmp/host_dna/out/dna.c

      - name: Host-build makesrna v6 (RNA_blender_cpp.h fix)
        run: |
          set -x
          cd $GITHUB_WORKSPACE/Blender-android_arm64
          mkdir -p /tmp/host_rna/out/intern /tmp/host_rna/bin
          # copy dna outputs where makesrna expects them
          cp /tmp/host_dna/out/dna.c /tmp/host_dna/out/dna_type_offsets.h /tmp/host_dna/out/dna_verify.c /tmp/host_rna/bin/ 2>/dev/null || true
          cp /tmp/host_dna/inc/dna_includes_all.h /tmp/host_dna/inc/dna_includes_as_strings.h /tmp/host_rna/bin/ 2>/dev/null || true
          # collect WITH_ defines from OBlender CMakeLists so RNA matches Android build
          DEFINES=$(grep -o '\-DWITH_[A-Z0-9_]*' $GITHUB_WORKSPACE/OBlender/app/src/main/cpp/CMakeLists.txt | sort -u | tr '\n' ' ')
          echo "DEFINES=$DEFINES"
          cd $GITHUB_WORKSPACE/Blender-android_arm64/source/blender/makesrna/intern
          # v8: C files with gcc (UNUSED macro is C-only), .cc with g++, then link
          mkdir -p /tmp/host_rna/obj
          CFLAGS="-DWITH_DNA_GHASH $DEFINES -w -I. -I.. -I../../asset_system -I../../blenfont -I../../blenkernel -I../../blenlib -I../../blenloader -I../../blentranslation -I../../bmesh -I../../depsgraph -I../../draw -I../../gpu -I../../ikplugin -I../../imbuf -I../../makesdna -I../../modifiers -I../../nodes -I../../sequencer -I../../simulation -I../../windowmanager -I../../editors/include -I../../render -I../../../../intern/clog -I../../../../intern/cycles/blender -I../../../../intern/atomic -I../../../../intern/guardedalloc -I../../../../intern/memutil -I../../../../intern/mantaflow/extern -I/tmp/host_dna/out -I/tmp/host_rna/bin -I$GITHUB_WORKSPACE/Blender-android_arm64/source/blender/makesdna"
          FAIL=0
          # v9: strip ../ from obj names (leading dots are skipped by *.o glob!)
          # v9: extra -I mirror makesrna CMake WITH_* blocks (python/ffmpeg/alembic/audaspace)
          CFLAGS="$CFLAGS -I../../python -I../../../../intern/ffmpeg -I../../io/alembic -I../../../../extern/audaspace/include -I../../../../extern/audaspace/bindings/C -I$GITHUB_WORKSPACE/lib-android_arm64/ffmpeg/include"
          for f in makesrna.c rna_define.c $(ls rna_*.c | grep -v rna_access_compare_override) ../../../../intern/clog/clog.c ../../blenlib/intern/BLI_assert.c ../../blenlib/intern/BLI_ghash.c ../../blenlib/intern/BLI_ghash_utils.c ../../blenlib/intern/BLI_memarena.c ../../blenlib/intern/BLI_mempool.c ../../blenlib/intern/hash_mm2a.c ../../blenlib/intern/endian_switch.c ../../../../intern/guardedalloc/intern/mallocn.c ../../../../intern/guardedalloc/intern/mallocn_guarded_impl.c ../../../../intern/guardedalloc/intern/mallocn_lockfree_impl.c ../../../../release/datafiles/userdef/userdef_default.c ../../../../release/datafiles/userdef/userdef_default_theme.c /tmp/host_dna/out/dna.c ../../makesdna/intern/dna_utils.c ../../makesdna/intern/dna_genfile.c ../../makesdna/intern/dna_defaults.c; do
            n=$(echo "$f" | sed 's|\.\./||g' | tr '/' '_')
            gcc -c "$f" -o "/tmp/host_rna/obj/$n.o" $CFLAGS > /tmp/host_rna/last.log 2>&1 || { echo "FAIL: $f"; head -n 5 /tmp/host_rna/last.log; FAIL=1; }
          done
          echo "C compile done FAIL=$FAIL"
          for f in ../../../../intern/guardedalloc/intern/leak_detector.cc ../../../../intern/guardedalloc/intern/memory_usage.cc ../../blenlib/intern/listbase.cc; do
            n=$(echo "$f" | sed 's|\.\./||g' | tr '/' '_')
            g++ -fpermissive -w -c "$f" -o "/tmp/host_rna/obj/$n.o" $CFLAGS -I../../../../intern/guardedalloc > /tmp/host_rna/last.log 2>&1 || { echo "FAIL: $f"; head -n 5 /tmp/host_rna/last.log; FAIL=1; }
          done
          echo "CC compile done FAIL=$FAIL"
          ls /tmp/host_rna/obj/ | wc -l
          g++ -fpermissive -w /tmp/host_rna/obj/*.o -o /tmp/host_rna/makesrna -lm -lpthread 2>&1 | head -n 20 || echo "LINK DONE rc=$?"
          ls -lh /tmp/host_rna/makesrna || echo "makesrna binary missing"
          if [ -x /tmp/host_rna/makesrna ]; then
            /tmp/host_rna/makesrna /tmp/host_rna/out/intern/ /tmp/host_rna/out/
            echo "=== generated ==="
            ls /tmp/host_rna/out/intern/ | head -n 20
            ls /tmp/host_rna/out/*.h 2>/dev/null | head -n 20
            ls /tmp/host_rna/out/intern/RNA_blender_cpp.h /tmp/host_rna/out/RNA_prototypes.h 2>&1 || true
          else
            echo "SKIP rna generation"
          fi

      - name: Build MakeBlender release (.a libs)
        run: |
          set -x
          cd $GITHUB_WORKSPACE/Utilities-android_arm64/MakeBlender
          gradle assembleRelease --stacktrace 2>&1 | tail -n 100 || true
          echo "=== inject dna.c + rna gen into .cxx ==="
          find $GITHUB_WORKSPACE -type d -path "*makesdna/intern" 2>/dev/null | head -n 10 || true
          for d in $(find $GITHUB_WORKSPACE -type d -path "*blender/makesdna/intern" 2>/dev/null); do
            echo "inject dna to $d"
            cp /tmp/host_dna/out/dna.c /tmp/host_dna/out/dna_type_offsets.h /tmp/host_dna/out/dna_verify.c "$d/" || true
            cp /tmp/host_dna/inc/dna_includes_all.h /tmp/host_dna/inc/dna_includes_as_strings.h "$d/" || true
          done
          echo "=== inject rna gen into .cxx ==="
          if [ -d /tmp/host_rna/out/intern ]; then
            for d in $(find $GITHUB_WORKSPACE -type d -path "*blender/makesrna/intern" 2>/dev/null); do
              echo "inject rna to $d"
              cp /tmp/host_rna/out/intern/* "$d/" 2>/dev/null || true
            done
            for d in $(find $GITHUB_WORKSPACE -type d -path "*blender/makesrna" 2>/dev/null | grep -v intern); do
              echo "inject rna headers to $d"
              cp /tmp/host_rna/out/*.h "$d/" 2>/dev/null || true
            done
          fi
          gradle assembleRelease --stacktrace 2>&1 | tail -n 150
        continue-on-error: true

      - name: Check MakeBlender .a outputs
        if: always()
        run: |
          find $GITHUB_WORKSPACE/Utilities-android_arm64 -name "libbf_*.a" 2>/dev/null | head -n 20 || true
          find $GITHUB_WORKSPACE/Utilities-android_arm64 -name "*.a" 2>/dev/null | wc -l || true

      - name: Build OBlender APK
        working-directory: OBlender
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tail -n 300
        continue-on-error: true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oblender-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
